# Render Blueprint — PROTOTYPE ONLY. Do not deploy publicly with Swiss Ephemeris
# until the licensing decision (AGPL vs Professional) is made. See LICENSING.md.
services:
  - type: web
    name: hermes-trutine-calculation
    runtime: docker
    rootDir: calculation-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: CALCULATION_SERVICE_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://your-app.lovable.app (comma-separated)
